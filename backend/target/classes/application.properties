# Application
spring.application.name=bapi-digital
server.port=${PORT:8081}

# MongoDB (uses env var on Render, falls back to localhost for dev)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/bapidigital}
spring.data.mongodb.database=bapidigital

# JWT
app.jwt.secret=${APP_JWT_SECRET:BapiDigitalSecretKeyForJWTTokenGeneration2024MustBeLongEnoughForHS512}
app.jwt.expiration-ms=86400000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}

# Admin Default Credentials (only used for initial setup)
app.admin.default-username=admin
app.admin.default-password=BapiDigital@2024

# Logging
logging.level.com.bapidigital=DEBUG
