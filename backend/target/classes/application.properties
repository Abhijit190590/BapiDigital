# Application
spring.application.name=bapi-digital
server.port=${PORT:8081}

# MongoDB (uses env var on Render, falls back to localhost for dev)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/bapidigital}
spring.data.mongodb.database=bapidigital

# JWT
# Set `APP_JWT_SECRET` in the environment on production. Leave empty for local dev
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=86400000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}

# Admin default seeding
# To create a default admin on first boot, set `APP_CREATE_DEFAULT_ADMIN=true` and
# provide `APP_ADMIN_DEFAULT_USERNAME` and `APP_ADMIN_DEFAULT_PASSWORD` in the environment.
app.create-default-admin=false
app.admin.default-username=
app.admin.default-password=

# Logging
logging.level.com.bapidigital=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info
