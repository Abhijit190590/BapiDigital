<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — Bapi Digital</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>">
</head>
<body>
  <div class="nav-overlay" id="navOverlay"></div>
  <nav class="navbar" id="navbar">
    <a href="index.html" class="nav-brand">
      <div class="brand-icon">📸</div>
      Bapi Digital
    </a>
    <div class="nav-title">Gallery</div>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="index.html#productGrid">Catalogue</a></li>
      <li><a href="gallery.html" class="active">Gallery</a></li>
      <li><a href="feedback.html">Feedback Form</a></li>
      <li><a href="admin/login.html">Admin</a></li>
    </ul>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <main class="main-content">
    <div class="container">
      <section class="gallery-section animate-in" style="text-align: center; padding: var(--space-3xl) 0;">
        <h1 class="section-title" style="font-size: 3rem; margin-bottom: var(--space-lg);">Our <span class="highlight">Gallery</span></h1>
        <p style="max-width: 600px; margin: 0 auto var(--space-xl); color: var(--text-secondary);">A showcase of our best works and premium studio products in action.</p>
        
        <div class="gallery-grid" id="galleryGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--space-lg);">
          <!-- Gallery images will be loaded here -->
        </div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-brand">📸 Bapi Digital</div>
      <p>&copy; 2026 Bapi Digital. All rights reserved.</p>
    </div>
    </footer>

  <script>
    async function loadGallery() {
      const grid = document.getElementById('galleryGrid');
      try {
        const images = await API.getGallery();
        if (images.length === 0) {
          grid.innerHTML = '<p style="grid-column: 1/-1; color: var(--text-muted);">No images in gallery yet.</p>';
          return;
        }
        grid.innerHTML = images.map(img => `
          <div class="gallery-item" style="position:relative; aspect-ratio: 1; overflow:hidden; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); transition: var(--transition); cursor:pointer;" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
            <img src="${img.imageUrl}" style="width:100%; height:100%; object-fit:cover;">
            <div style="position:absolute; bottom:0; left:0; right:0; background:linear-gradient(transparent, rgba(0,0,0,0.7)); color:white; padding:var(--space-md); text-align:left; font-size:0.9rem;">
              ${img.caption || ''}
            </div>
          </div>
        `).join('');
      } catch (err) {
        grid.innerHTML = '<p style="grid-column: 1/-1; color: var(--danger);">Error loading gallery.</p>';
      }
    }

    loadGallery();

    document.getElementById('navToggle').addEventListener('click', () => {
      document.getElementById('navLinks').classList.toggle('open');
      document.getElementById('navOverlay').classList.toggle('active');
    });

    document.getElementById('navOverlay').addEventListener('click', () => {
      document.getElementById('navLinks').classList.remove('open');
      document.getElementById('navOverlay').classList.remove('active');
    });

    document.querySelectorAll('.nav-links a').forEach(link => {
      link.addEventListener('click', () => {
        document.getElementById('navLinks').classList.remove('open');
        document.getElementById('navOverlay').classList.remove('active');
      });
    });
  </script>
</body>
</html>
