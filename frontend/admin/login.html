<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Bapi Digital</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>">
  </head>
  <body>
    <div class="login-page">
      <div class="login-card">
        <div class="login-header">
          <div class="login-icon">🔐</div>
          <h2>Admin Login</h2>
          <p class="login-subtitle">Sign in to manage your Bapi Digital store</p>
        </div>
  
        <div class="login-error" id="loginError"></div>
  
        <form id="loginForm">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" class="form-control" placeholder="Enter username" required autocomplete="username">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">
            Sign In
          </button>
        </form>
  
        <div style="text-align:center; margin-top: var(--space-lg);">
          <a href="../index.html" style="font-size: 0.85rem;">← Back to Store</a>
        </div>
      </div>
    </div>
  
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script>

    // Redirect if already logged in
    if (API.isLoggedIn()) window.location.href = 'dashboard.html';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errorEl = document.getElementById('loginError');

      btn.textContent = 'Signing in...';
      btn.disabled = true;
      errorEl.style.display = 'none';

      try {
        await API.login(
          document.getElementById('username').value,
          document.getElementById('password').value
        );
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
        btn.textContent = 'Sign In';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
