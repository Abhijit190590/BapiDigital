<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bapi Digital - Product Details">
  <title>Product Details — Bapi Digital</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/product.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="nav-brand"><div class="brand-icon">📸</div> Bapi Digital</a>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="admin/login.html">Admin</a></li>
    </ul>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
  </nav>

  <main class="main-content">
    <div class="container product-detail">

      <!-- Loading -->
      <div id="loadingState" style="text-align:center; padding: 80px 0;">
        <div class="skeleton" style="width:60px; height:60px; border-radius:50%; margin:0 auto var(--space-lg);"></div>
        <p style="color: var(--text-muted);">Loading product details...</p>
      </div>

      <!-- Product Detail -->
      <div class="product-detail-grid" id="productDetail" style="display:none;">
        <!-- Gallery -->
        <div class="gallery">
          <div class="gallery-main" id="galleryMain" onclick="openZoom()">
            <img id="mainImage" src="" alt="Product image">
          </div>
          <div class="gallery-thumbs" id="galleryThumbs"></div>
        </div>

        <!-- Info -->
        <div class="product-info">
          <div class="breadcrumb">
            <a href="index.html">Home</a>
            <span>/</span>
            <span id="breadcrumbCategory">Product</span>
          </div>
          <span class="category-label" id="detailCategory"></span>
          <h1 id="detailName"></h1>
          <div class="price-tag" id="detailPrice"></div>
          <div class="description" id="detailDesc"></div>

          <div class="product-actions">
            <a id="buyNowBtn" href="#" target="_blank" class="btn btn-whatsapp btn-lg btn-block">
              💬 Buy Now via WhatsApp
            </a>
            <a href="index.html" class="btn btn-outline btn-block">← Continue Shopping</a>
          </div>

          <div class="product-meta" id="productMeta">
            <div class="meta-item"><span class="icon">📦</span> Category: <strong id="metaCategory"></strong></div>
            <div class="meta-item"><span class="icon">📅</span> Added: <strong id="metaDate"></strong></div>
          </div>
        </div>
      </div>

      <!-- Error -->
      <div class="empty-state" id="errorState" style="display:none;">
        <div class="empty-icon">😕</div>
        <h3>Product not found</h3>
        <p>The product you're looking for doesn't exist or has been removed.</p>
        <a href="index.html" class="btn btn-primary" style="margin-top: var(--space-lg);">Go Home</a>
      </div>
    </div>
  </main>

  <!-- Zoom Overlay -->
  <div class="zoom-overlay" id="zoomOverlay" onclick="closeZoom()">
    <img id="zoomImage" src="" alt="Zoomed image">
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer-brand">📸 Bapi Digital</div>
      <p>&copy; 2024 Bapi Digital. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
